[pytest]
pythonpath = .
asyncio_mode = auto
markers =
    integration: requires the full Docker Compose stack (Postgres, Qdrant, Redis, MinIO, Keycloak, and usually a Celery worker) -- see tests/integration/*.py module docstrings for exact prerequisites per file
    e2e: full-stack Playwright UI flow against the running Next.js app + API + Keycloak; skipped by default, pass --e2e to run
