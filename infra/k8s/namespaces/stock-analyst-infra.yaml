apiVersion: v1
kind: Namespace
metadata:
  name: stock-analyst-infra
  labels:
    app: stock-analyst
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stock-analyst-infra-quota
  namespace: stock-analyst-infra
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "8"
    limits.memory: 32Gi
