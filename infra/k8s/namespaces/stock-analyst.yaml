apiVersion: v1
kind: Namespace
metadata:
  name: stock-analyst
  labels:
    app: stock-analyst
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stock-analyst-quota
  namespace: stock-analyst
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 64Gi
