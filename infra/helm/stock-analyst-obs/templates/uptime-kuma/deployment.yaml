apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: uptime-kuma
    {{- include "stock-analyst-obs.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        {{- include "stock-analyst-obs.labels" . | nindent 8 }}
    spec:
      containers:
        - name: uptime-kuma
          image: {{ .Values.uptimeKuma.image }}
          ports:
            - name: http
              containerPort: {{ .Values.uptimeKuma.port }}
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: /app/data
          resources:
            requests:
              cpu: {{ .Values.uptimeKuma.resources.requests.cpu }}
              memory: {{ .Values.uptimeKuma.resources.requests.memory }}
            limits:
              cpu: {{ .Values.uptimeKuma.resources.limits.cpu }}
              memory: {{ .Values.uptimeKuma.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: uptime-kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
