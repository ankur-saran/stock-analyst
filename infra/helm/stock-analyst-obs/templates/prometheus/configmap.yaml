apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus
    {{- include "stock-analyst-obs.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # FastAPI app metrics (apps/api's /metrics endpoint).
      - job_name: fastapi
        metrics_path: /metrics
        static_configs:
          - targets: ["stock-analyst-api.stock-analyst.svc.cluster.local:8000"]

      # Celery task/queue metrics, exported by Flower.
      - job_name: celery
        metrics_path: /metrics
        static_configs:
          - targets: ["flower.stock-analyst.svc.cluster.local:5555"]

      # Qdrant vector store metrics.
      - job_name: qdrant
        metrics_path: /metrics
        static_configs:
          - targets: ["qdrant.stock-analyst-data.svc.cluster.local:6333"]

      # postgres-exporter sidecar on the postgres pod (see stock-analyst-data).
      - job_name: postgres
        metrics_path: /metrics
        static_configs:
          - targets: ["postgres.stock-analyst-data.svc.cluster.local:9187"]

      # Per-node system metrics — node-exporter DaemonSet runs hostNetwork,
      # so each node is reached directly at its InternalIP:9100.
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: "${1}:{{ .Values.nodeExporter.port }}"
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
