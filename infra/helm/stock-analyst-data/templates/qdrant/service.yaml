apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: qdrant
    {{- include "stock-analyst-data.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: {{ .Values.qdrant.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.qdrant.grpcPort }}
      targetPort: grpc
