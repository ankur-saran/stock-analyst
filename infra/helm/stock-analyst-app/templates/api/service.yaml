apiVersion: v1
kind: Service
metadata:
  # Named stock-analyst-api (not just "api") so Traefik's IngressRoute in
  # stock-analyst-infra can address it unambiguously across namespaces.
  name: stock-analyst-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    {{- include "stock-analyst-app.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "{{ .Values.api.port }}"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
