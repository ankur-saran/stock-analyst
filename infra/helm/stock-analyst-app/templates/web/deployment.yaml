apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web
    {{- include "stock-analyst-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        {{- include "stock-analyst-app.labels" . | nindent 8 }}
    spec:
      {{- include "stock-analyst-app.nodeAffinity" . | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.global.registry }}/stock-analyst-web:{{ .Values.web.imageTag }}"
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.stock-analyst.internal
            - name: NEXTAUTH_URL
              value: https://app.stock-analyst.internal
            - name: NEXT_PUBLIC_KEYCLOAK_URL
              value: https://auth.stock-analyst.internal
            - name: NEXT_PUBLIC_KEYCLOAK_CLIENT_ID
              value: {{ .Values.dependencies.keycloak.webClientId | quote }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: NEXTAUTH_SECRET
          resources:
            requests:
              cpu: {{ .Values.web.resources.requests.cpu }}
              memory: {{ .Values.web.resources.requests.memory }}
            limits:
              cpu: {{ .Values.web.resources.limits.cpu }}
              memory: {{ .Values.web.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
