# Mirrors infra/litellm/config.yaml (the docker-compose dev config) — same
# model routing so behavior doesn't drift between local dev and the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: litellm
    {{- include "stock-analyst-infra.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      - model_name: primary
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: os.environ/ANTHROPIC_API_KEY

      - model_name: secondary
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY

      - model_name: local
        litellm_params:
          model: ollama/llama3.1:70b
          api_base: http://ollama.stock-analyst-ml.svc.cluster.local:11434

    router_settings:
      fallbacks:
        - primary: ["local"]
      context_window_fallbacks:
        - primary: ["secondary"]

    litellm_settings:
      success_callback: ["langsmith"]
      drop_params: true
