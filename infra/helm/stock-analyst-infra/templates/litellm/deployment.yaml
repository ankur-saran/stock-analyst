apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: litellm
    {{- include "stock-analyst-infra.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        {{- include "stock-analyst-infra.labels" . | nindent 8 }}
    spec:
      # SA bound (via configure_vault.sh) to the "litellm" Vault role so the
      # CSI driver below can authenticate and mount secret/data/stock-analyst/llm-keys.
      serviceAccountName: vault-auth
      containers:
        - name: litellm
          image: {{ .Values.litellm.image }}
          args: ["--config", "/app/config.yaml", "--port", "{{ .Values.litellm.port }}", "--num_workers", "1"]
          ports:
            - name: http
              containerPort: {{ .Values.litellm.port }}
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.existingSecret }}
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.existingSecret }}
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            # Triggers the CSI driver's secretObjects sync so the
            # litellm-llm-keys Secret referenced above actually exists.
            - name: vault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.litellm.resources.requests.cpu }}
              memory: {{ .Values.litellm.resources.requests.memory }}
            limits:
              cpu: {{ .Values.litellm.resources.limits.cpu }}
              memory: {{ .Values.litellm.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
        - name: vault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: litellm-llm-keys
