apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: litellm
    {{- include "stock-analyst-infra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: {{ .Values.litellm.port }}
      targetPort: http
