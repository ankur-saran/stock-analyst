# Every Deployment that mounts a Vault CSI SecretProviderClass runs as
# serviceAccountName: vault-auth (see postgres/minio/litellm/keycloak/api
# etc.) — without this object existing in each of their namespaces first,
# the ServiceAccount admission controller rejects those pods outright, and
# no amount of correct Vault configuration matters. Derived from vaultSecrets
# rather than hardcoded so a new namespace in that list gets its
# ServiceAccount automatically.
{{- $namespaces := list }}
{{- range .Values.vaultSecrets }}
{{- $namespaces = append $namespaces .namespace }}
{{- end }}
{{- range ($namespaces | uniq) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: {{ . }}
  labels:
    {{- include "stock-analyst-infra.labels" $ | nindent 4 }}
{{- end }}
