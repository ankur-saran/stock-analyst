apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-analyst-infra.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.traefik.rateLimit.average }}
    burst: {{ .Values.traefik.rateLimit.burst }}
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stock-analyst-infra.labels" . | nindent 4 }}
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
