apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ollama
    {{- include "stock-analyst-ml.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.ollama.storageClass }}
  resources:
    requests:
      storage: {{ .Values.ollama.storage }}
