# Requires the NVIDIA device plugin DaemonSet already running on the GPU
# node (advertises nvidia.com/gpu) — without it this pod stays Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ollama
    {{- include "stock-analyst-ml.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Single GPU + single ReadWriteOnce volume — never run two at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        {{- include "stock-analyst-ml.labels" . | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: http
              containerPort: {{ .Values.ollama.port }}
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "ollama pull {{ .Values.ollama.embeddingModel }}"
          resources:
            requests:
              cpu: {{ .Values.ollama.resources.requests.cpu }}
              memory: {{ .Values.ollama.resources.requests.memory }}
              nvidia.com/gpu: {{ index .Values.ollama.resources.requests "nvidia.com/gpu" | quote }}
            limits:
              cpu: {{ .Values.ollama.resources.limits.cpu }}
              memory: {{ .Values.ollama.resources.limits.memory }}
              nvidia.com/gpu: {{ index .Values.ollama.resources.limits "nvidia.com/gpu" | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models
