# Runs once after ollama is up, pulling every model the platform depends on
# via Ollama's HTTP API so the first real request doesn't pay a multi-GB
# download. Re-running is a no-op — `ollama pull` on an already-present tag
# just checks digests and returns immediately.
apiVersion: batch/v1
kind: Job
metadata:
  name: embedding-model-pull
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: embedding-job
    {{- include "stock-analyst-ml.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embedding-job
        {{- include "stock-analyst-ml.labels" . | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: pull-models
          image: {{ .Values.embeddingJob.image }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until curl -sf http://ollama:{{ .Values.ollama.port }}/ >/dev/null; do
                echo "waiting for ollama..."
                sleep 3
              done
              {{- range .Values.embeddingJob.models }}
              echo "pulling {{ . }}"
              curl -sf -X POST http://ollama:{{ $.Values.ollama.port }}/api/pull \
                -d '{"name":"{{ . }}","stream":false}'
              {{- end }}
