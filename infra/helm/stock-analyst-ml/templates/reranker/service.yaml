apiVersion: v1
kind: Service
metadata:
  name: reranker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: reranker
    {{- include "stock-analyst-ml.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: reranker
  ports:
    - name: http
      port: {{ .Values.reranker.port }}
      targetPort: http
